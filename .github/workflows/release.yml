# Code is a modified version of https://github.com/codedeliveryservice/Reckless/blob/main/.github/workflows/release.yml
# Check the original repository for license details

name: JustBot Releases

on: [workflow_dispatch]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: justbot-linux-generic
            rustflags: "-C target-cpu=x86-64"

          - os: ubuntu-24.04-arm
            name: justbot-linux-aarch64-neon
            target: aarch64-unknown-linux-musl
            rustflags: "-C target-cpu=generic -C target-feature=+neon,+crt-static"

          - os: ubuntu-latest
            name: justbot-linux-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            sde_flag: -bdw

          - os: ubuntu-latest
            name: justbot-linux-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+gfni,+avx512bw,+avx512vl,+avx512vbmi,+avx512vbmi2,+avx512vnni,+avx512bitalg"
            sde_flag: -icx

          - os: windows-latest
            name: justbot-windows-generic
            rustflags: "-C target-cpu=x86-64"

          - os: windows-latest
            name: justbot-windows-avx2
            rustflags: "-C target-cpu=x86-64-v3"
            sde_flag: -bdw

          - os: windows-latest
            name: justbot-windows-avx512
            rustflags: "-C target-cpu=x86-64-v4 -C target-feature=+gfni,+avx512bw,+avx512vl,+avx512vbmi,+avx512vbmi2,+avx512vnni,+avx512bitalg"
            sde_flag: -icx

          - os: macos-latest
            name: justbot-macos
            rustflags: "-C target-cpu=native"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Select build target
        id: target
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ -z "$BUILD_TARGET" ]; then
            BUILD_TARGET=$(rustc --print host-tuple)
          else
            rustup target add "$BUILD_TARGET"
          fi
          echo "triple=$BUILD_TARGET" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          rustup component add llvm-tools
          cargo install cargo-pgo

      - name: Install musl linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Setup Intel SDE
        if: matrix.sde_flag != ''
        uses: petarpetrovt/setup-sde@v5.0
        with:
          sdeVersion: "9.58.0"
          environmentVariableName: SDE_PATH

      - name: Instrument build for PGO
        run: |
          cargo pgo instrument -- --target ${{ steps.target.outputs.triple }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"

      - name: Run PGO profiling benchmarks
        if: matrix.name == 'justbot-linux-avx2' || matrix.name == 'justbot-linux-avx512'
        run: |
          "$SDE_PATH/sde64" ${{ matrix.sde_flag }} -- cargo pgo run -- --target ${{ steps.target.outputs.triple }} -- bench
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"

      - name: Run PGO profiling benchmarks
        if: matrix.name == 'justbot-windows-avx2' || matrix.name == 'justbot-windows-avx512'
        shell: cmd
        run: |
          "%SDE_PATH%\sde.exe" ${{ matrix.sde_flag }} -- cargo pgo run -- --target ${{ steps.target.outputs.triple }} -- bench
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"

      - name: Run PGO profiling benchmarks
        if: matrix.sde_flag == ''
        run: |
          cargo pgo run -- --target ${{ steps.target.outputs.triple }} -- bench
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"

      - name: Optimize build with PGO
        run: |
          cargo pgo optimize -- --target ${{ steps.target.outputs.triple }}
        env:
          RUSTFLAGS: "${{ matrix.rustflags }}"

      - name: Rename binary with platform suffix
        shell: bash
        run: |
          tuple="${{ steps.target.outputs.triple }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv target\\$tuple\\release\\justbot.exe ${{ matrix.name }}.exe
          else
            mv target/$tuple/release/justbot ${{ matrix.name }}
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5.0.0
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            ${{ matrix.name }}.exe
          retention-days: 1

  release:
    name: Development release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get short SHA hash
        id: hash
        run: echo "COMMIT_SHA=$(git rev-parse HEAD | cut -c 1-8)" >> $GITHUB_ENV

      - name: Download build artifacts
        uses: actions/download-artifact@v6.0.0
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          name: justbot 0.5.0-dev-${{ env.COMMIT_SHA }}
          draft: true
          prerelease: true
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
