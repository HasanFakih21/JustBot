[package]
name = "justbot"
version = "0.5.0-dev"
edition = "2024"
build = "build.rs"

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1

[dependencies]
rand = { version = "0.10.2", optional = true }

# stats dependencies
linkme = { version = "0.3", optional = true }
histogram = { version = "1.3", optional = true }

[features]
default = ["stats"]
tuning = []
datagen = ["dep:rand"]
stats = ["dep:linkme", "dep:histogram"]
